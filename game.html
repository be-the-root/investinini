<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Last Light — Investigation</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body class="game">

    <header class="bar">
        <a href="index.html" class="bar__back">← Restart</a>
        <div class="bar__case">
            <span class="bar__label">Case File</span>
            <span class="bar__title">The Last Light · 03:47 AM</span>
        </div>
        <div class="bar__count">
            <span id="clue-count">0 / 6</span>
            <span class="bar__unit">objects examined</span>
        </div>
    </header>

    <main class="stage">

        <section class="scene" id="scene">
            <div class="scene__beam" aria-hidden="true"></div>
            <div class="scene__glow" aria-hidden="true"></div>
            <!-- hotspots injected by JS -->
        </section>

        <aside class="journal">
            <h2 class="journal__title">Field Notes</h2>
            <ul class="journal__list" id="journal-list">
                <li class="journal__empty">Nothing recorded yet.</li>
            </ul>
        </aside>

    </main>

    <section class="deduction" id="deduction" hidden>
        <p class="deduction__prompt" id="deduction-prompt"></p>
        <div class="deduction__options" id="deduction-options"></div>
        <p class="deduction__feedback" id="deduction-feedback"></p>
    </section>

    <!-- Clue panel -->
    <div class="panel" id="panel" hidden>
        <div class="panel__box">
            <span class="panel__tag" id="panel-tag"></span>
            <h3 class="panel__title" id="panel-title"></h3>
            <p class="panel__body" id="panel-body"></p>
            <button class="panel__close" id="panel-close">Close</button>
        </div>
    </div>

    <!-- Ending -->
    <div class="ending" id="ending" hidden>
        <div class="ending__box">
            <span class="ending__tag">Case Closed</span>
            <h2 class="ending__title" id="ending-title"></h2>
            <p class="ending__body" id="ending-body"></p>
            <a href="index.html" class="ending__btn">Restart</a>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
